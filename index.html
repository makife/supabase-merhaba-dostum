    <!-- Mobile touch and audio unlock script -->
    <script>
      // Mobile audio unlock - sayfa yüklendiğinde çalışır
      document.addEventListener('DOMContentLoaded', function() {
        let audioUnlocked = false;

        function unlockAudio() {
          if (audioUnlocked) return;

          console.log('🔊 Mobile audio unlock attempt');

          // Sessiz audio dosyası çal
          const audio = new Audio();
          audio.volume = 0;
          audio.preload = 'auto';

          const unlockPromise = audio.play();
          if (unlockPromise) {
            unlockPromise.then(() => {
              audio.pause();
              audioUnlocked = true;
              console.log('✅ Mobile audio unlocked successfully');

              // Event listener'ları kaldır
              document.removeEventListener('touchstart', unlockAudio);
              document.removeEventListener('touchend', unlockAudio);
              document.removeEventListener('click', unlockAudio);
            }).catch((error) => {
              console.log('❌ Mobile audio unlock failed:', error);
            });
          }
        }

        // İlk dokunuşta ses kilidini aç
        document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
        document.addEventListener('touchend', unlockAudio, { once: true, passive: true });
        document.addEventListener('click', unlockAudio, { once: true });

        // Viewport height fix for mobile
        function setVH() {
          let vh = window.innerHeight * 0.01;
          document.documentElement.style.setProperty('--vh', `${vh}px`);
        }

        window.addEventListener('resize', setVH);
        setVH();
      });
    </script>

    <style>
      /* Mobile viewport fix */
      :root {
        --vh: 1vh;
      }

      .mobile-container {
        min-height: 100vh;
        min-height: calc(var(--vh, 1vh) * 100);
      }

      /* Prevent zoom on input focus - mobile */
      input, textarea, select {
        font-size: 16px !important;
      }

      /* Mobile tap highlight removal */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      /* Prevent elastic scroll and auto-hide navigation */
      html {
        overscroll-behavior: none;
        touch-action: manipulation;
      }

      body {
        overscroll-behavior: none;
        overscroll-behavior-y: none;
        touch-action: manipulation;
      }

      /* Mobile browser UI auto-hide */
      @media (max-width: 768px) {
        html, body {
          height: 100%;
          overflow: hidden;
          position: fixed;
          width: 100%;
        }

        #root {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          overflow-y: auto;
          overflow-x: hidden;
          overscroll-behavior: none;
          -webkit-overflow-scrolling: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
